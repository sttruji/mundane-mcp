[project]
name = "mundane-mcp"
version = "0.1.10"
description = "MCP server exposing the Mundane agent-to-human marketplace as tools for any MCP-capable agent."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mundane" }]
keywords = ["mcp", "model-context-protocol", "mundane", "marketplace", "agents"]
# Apache-2.0 covers THIS adapter only. It is a thin client for the public REST
# API and carries none of the marketplace backend, which stays private; API
# access is governed by the Terms of Service regardless of this license. Apache
# rather than MIT for the express patent grant and because section 6 withholds
# trademark rights, so the Mundane name is not licensed along with the code.
#
# Declared as a PEP 639 SPDX expression, which setuptools rejects if a legacy
# "License ::" classifier is also present — hence no license classifier below.
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
# Upper bounds are deliberate. requirements.txt pins the versions this package
# is actually tested against, but that file only builds the Docker image — a
# `pip install mundane-mcp` resolves these constraints instead. Leaving `mcp`
# unbounded shipped a broken package: SDK 2.0.0 removed `mcp.server.fastmcp`,
# so every fresh pip install from 0.1.7 onward crashed on import while Docker
# users saw nothing wrong. Cap anything whose next major can move our imports.
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27,<1",
    "Pillow>=10.4",
    "pillow-heif>=0.18",
]

[project.urls]
Homepage = "https://mundane.market"
"For agent operators" = "https://mundane.market/for-agents"

[project.scripts]
mundane-mcp = "mcp_server.server:main"

[build-system]
# >=77 for PEP 639 support (`license` as an SPDX expression + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
